<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console LXC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="/css/lxc-console.css">
</head>
<body>
    <div class="console-lxc-layout" id="console-layout">
        <div class="console-lxc-toolbar">
            <button type="button" class="lxc-tb-btn" data-action="copy" title="Copier la sélection">
                <i class="fa-solid fa-copy"></i>
            </button>
            <button type="button" class="lxc-tb-btn" data-action="paste" title="Coller depuis le presse-papiers">
                <i class="fa-solid fa-paste"></i>
            </button>
            <span class="lxc-tb-sep"></span>
            <button type="button" class="lxc-tb-btn" data-action="font-dec" title="Réduire la police">A−</button>
            <button type="button" class="lxc-tb-btn" data-action="font-inc" title="Agrandir la police">A+</button>
            <button type="button" class="lxc-tb-btn" data-action="fit" title="Ajuster la taille du terminal à la fenêtre">
                <i class="fa-solid fa-up-right-and-down-left-from-center"></i> Ajuster
            </button>
            <button type="button" class="lxc-tb-btn" data-action="fullscreen" title="Plein écran">
                <i class="fa-solid fa-expand"></i>
            </button>
            <button type="button" class="lxc-tb-btn" data-action="reload" title="Reconnecter la console">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
        <div class="console-lxc-terminal-wrap">
            <div id="status">Connexion…</div>
            <div id="terminal"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script type="module" src="/js/lxc-console.js"></script>
</body>
</html>
