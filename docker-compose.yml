# ProxPanel — Docker Compose
# Repo : https://github.com/sannier3/ProxPanel
#
# Build local :
#   cp .env.example .env && docker compose up -d --build
#
# Image publiée (GHCR) :
#   PROXPANEL_IMAGE_TAG=alpha docker compose up -d
#   PROXPANEL_IMAGE_TAG=latest docker compose up -d
#
# Tags disponibles : alpha (courant), latest (même build sur main pour l’instant)

services:
  proxpanel:
    image: ghcr.io/sannier3/proxpanel:${PROXPANEL_IMAGE_TAG:-alpha}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXPANEL_VERSION: ${PROXPANEL_VERSION:-alpha}
    container_name: proxpanel
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      WORKSPACE_DIR: /app/data/workspaces
    volumes:
      - ./modules:/app/modules:ro
      - ./data/workspaces:/app/data/workspaces
    extra_hosts:
      # Accès à l’API Proxmox sur l’hôte depuis le conteneur (Linux)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
